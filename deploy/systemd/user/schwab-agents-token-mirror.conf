# Token-ownership drop-in for the paper agents (copied to BOTH
# schwab-options-8709.service.d/ and schwab-swing-9947.service.d/).
#
# The agents must NOT own an OAuth refresh token: Schwab allows one active
# session per app+account, and two refreshing agents invalidate each other
# (2026-09-18 outage). They read the keeper-written mirror, which carries an
# access token and an empty refresh_token.
#
# The keeper (schwab-token-keeper.timer) owns refreshing and rewrites this
# mirror every 5 minutes.

[Service]
Environment=SCHWAB_TOKEN_DIR=%h/.config/schwabinvestbot/agents
