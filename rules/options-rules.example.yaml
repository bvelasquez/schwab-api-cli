version: 1
agent_id: spy-income-v1

accounts:
  - hash: "<hash-from-schwab-accounts-numbers>"
    label: "Margin account"
    type: margin
    enabled: true
  - hash: "<ira-hash>"
    label: "IRA"
    type: ira
    enabled: false

schedule:
  tick_interval_seconds: 60
  market_hours_only: true
  timezone: America/New_York

strategies:
  vertical:
    enabled: true
  iron_condor:
    enabled: true

watchlist:
  - symbol: SPY
    role: primary
    min_credit: 0.12
  - symbol: QQQ
    role: primary
    min_credit: 0.14
  - symbol: IWM
    role: fallback
    min_credit: 0.28

entry_policy:
  mode: first_qualifying
  fallback_only_after_primary_exhausted: true
  require_llm_proceed: true
  proceed_cache_minutes: 45
  entry_attempt_cooldown_minutes: 30
  promote_redeploy_symbol: false

entry_rules:
  vertical:
    type: put_credit
    dte_min: 32
    dte_max: 45
    min_credit: 0.50
    max_width: 5
    # Engine picks ONLY within this delta band (no fixed % OTM fallback).
    short_delta_min: 0.10
    short_delta_max: 0.16
    min_pop_pct: 70
    min_distance_to_be_pct: 5
    min_credit_to_width_pct: 12.5
    min_short_otm_pct: 5.0
    max_adverse_day_change_pct: 1.0
    reject_short_inside_1sigma: true   # fail-closed when chain IV missing
    min_iv_rv_ratio: 1.15              # fail-closed when IV or RV missing
    max_open_positions: 3
    max_contracts_per_trade: 2
  iron_condor:
    dte_min: 30
    dte_max: 45
    min_credit: 1.00
    wing_width: 5
    short_delta: 0.16
    min_iv_rv_ratio: 1.15
    max_open_positions: 2
    max_contracts_per_trade: 1

exit_rules:
  profit_target_pct: 50
  # stop_loss_pct is a MARK MULTIPLE: 250 = stop at debit_to_close ≥ 2.5× credit
  # (−150% of credit). Do not tighten below ~200: backtests show tighter stops
  # convert recoverable mark drawdowns into realized losses at these deltas.
  stop_loss_pct: 250
  dte_close: 21
  thesis:
    enabled: true
    # Let the protective order / overnight settle before thesis can fire.
    min_hold_minutes: 30
    # Exit early when the short is threatened — at ~3.5% OTM the close debit is
    # roughly half what a 2% OTM exit costs. This is the big loss-size lever.
    min_short_otm_pct: 3.0
    # Bank partial wins that never reach the 50% target.
    profit_giveback:
      peak_profit_min_pct: 40
      exit_if_below_pct: 10
    # Don't re-sell the same name immediately after a thesis exit.
    redeploy_cooldown_minutes: 240
  # Defensive roll on mechanical stop (verticals only). Stop-triggered only —
  # do NOT wire to thesis exits; the money check correctly refuses rolls when
  # the short is already being run over. Soak with --simulate before trusting.
  # Successful rolls skip stop-loss re-entry cooldown.
  roll:
    enabled: true
    min_dte_remaining: 21
    min_short_otm_pct: 0.5
    min_dte_extension: 7
    target_short_delta_max: 0.12
    max_debit_pct_of_entry_credit: 25
    max_rolls_per_position: 1
    max_rolls_per_day: 1

risk:
  max_portfolio_risk_usd: 10000
  max_risk_per_trade_usd: 2000
  # Soft churn cap (0 = unlimited). Prefer max_open_positions + $ risk as hard gates.
  max_trades_per_day: 4
  allowed_underlyings:
    - SPY
    - QQQ
    - IWM
  # SPY/QQQ/IWM put credits are effectively one position — cap the group.
  correlation_groups:
    - name: broad_market
      symbols: [SPY, QQQ, IWM]
      max_open: 1
  # max_drawdown_halt_pct: 15.0
  # drawdown_sleeve_usd: 4000
  re_entry_after_stop_loss:
    enabled: true
    cooldown_days: 5
  blocked_events: []
  # Date-aware macro blackout (inclusive lead window). Keep blocked_events empty
  # unless you want a manual hard pause of *all* entries.
  # blocked_dates:
  #   - date: "2026-09-16"
  #     lead_days: 1
  #     label: FOMC

# Map market regime → put_credit | call_credit | iron_condor | pause.
# Below the 50DMA now classifies as high_vol_chop (never Neutral → put_credit),
# and a missing VIX quote pauses entries (fail-closed) unless you opt out.
regime:
  enabled: true
  benchmark_symbol: SPY
  vix_symbol: $VIX
  vix_low: 14.0
  vix_high: 25.0
  pause_entries_vix_below: 14.0
  pause_entries_vix_above: 30.0
  pause_on_missing_vix: true
  realized_vol_lookback: 20
  strategy_map:
    low_vol_trend: put_credit
    elevated_vol: put_credit
    high_vol_chop: iron_condor
    bearish_trend: call_credit
    hostile: pause
    neutral: put_credit   # only reachable above the 50DMA now

execution:
  order_type: limit
  require_preview: true
  wait_for_fill: true
  fill_timeout_seconds: 300
  # Broker-resident GTC profit-target close order placed after each live entry fill — the
  # one piece of exit protection that survives the agent process being down. Stop-loss and
  # DTE-close remain mechanical (Schwab rejects stop triggers on multi-leg option orders).
  # See docs/OPTIONS_RULES.md#broker-side-protection-what-survives-if-the-agent-is-down
  protective_order:
    enabled: true
    max_attempts: 3
    max_seconds: 30

llm:
  enabled: false
  selection_model: anthropic/claude-sonnet-4
  monitor_model: google/gemini-2.5-flash
  web_model: perplexity/sonar
  review_every_ticks: 5
  web_research_every_reviews: 3
  max_tokens: 2000
  veto_entries: true
  allow_llm_exits: false
  prompts:
    # Override per strategy file. Omit fields to use built-in defaults.
    # selection: |
    #   Aggressive speculative premium seller — favor high credit, accept higher delta...
    # selection_context: |
    #   Speculative sleeve: willing to trade 7-14 DTE, 0.35+ delta, earnings plays OK...
    # monitor: |
    #   Tight risk manager for short-dated speculative positions...

notify:
  telegram:
    enabled: false
    notify_every_tick: false
    notify_on_actions: true
