    discover_every_minutes: 90
    run_premarket: true
    run_at_open: true
    max_add_per_refresh: 5
    movers_only: false
    write_pool: true
  feeds:
  - id: marketwatch_headlines
    label: MarketWatch Top Stories
    enabled: true
    kind: rss
    url: https://feeds.marketwatch.com/marketwatch/topstories/
    phases: []
    auth: null
    headers: {}
    max_bytes: 12000
    timeout_seconds: 15
