          stop_loss_pct: 5.5
          time_stop_days: null
          time_stop_minutes: null
          trailing:
            activate_after_profit_pct: 3.0
            trail_atr_multiple: 1.75
        entry:
          rsi_14_range: null
          max_new_entries_per_day: null
          position_size:
            method: null
