            activate_after_profit_pct: 3.0
            trail_atr_multiple: 2.25
        entry:
          rsi_14_range: [50.0, 65.0]
          max_new_entries_per_day: 2
          position_size:
            method: atr_normalized
            risk_per_trade_pct: 2.2
            max_position_pct: null
            atr_baseline_pct: null
            atr_vol_scalar_min: null
            atr_vol_scalar_max: null
        intraday: null
    baseline:
