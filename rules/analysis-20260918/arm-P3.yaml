version: 1
trader_id: swing-beneficiary-9947
accounts:
- hash: 1BA372D01BE13B486750C8433AFDCFB96C2A694770C4688417F0BEA6B676B25B
  label: Beneficiary account ending 9947 — equity swing sleeve
  type: margin
  enabled: true
capital:
  fixed_sleeve_cap_usd: 4000.0
  max_pct_of_free_cash: 80.0
  min_cash_floor_usd: 500.0
  options_risk:
    # Sum reserved risk across every options agent sharing this account.
    rules_files:
      - rules/options-pilot-9947.yaml
      - rules/options-monthly-income.yaml
    fallback_reserve_usd: 500.0
    buffer_pct: 10.0
  core_holdings:
  - SGOV
  - JPST
  - JAAA
  - SCHD
  - VYM
schedule:
  tick_interval_seconds: 90
  market_hours_only: true
  timezone: America/New_York
  # Needed so FMP can refresh just before the open.
  premarket_scan: true
  premarket_start_et: "08:00"
  premarket_tick_interval_seconds: 300
  overnight:
    enabled: false
playbook:
  style: swing
  direction: long
  holding_period:
    min_days: 2
    max_days: 30
    target_days: 10
  entry:
    min_price_usd: 5.0
    min_avg_volume_20d: 500000.0
    max_spread_pct: 0.6
    require_below_sma:
    - 9
    # Momentum band: skip weak RSI pullbacks that stall before the target.
    # 2026-09-17 Barry OK: floor reverted 50->48 (2y ablation: +$83 vs post-Sep9 cfg)
    rsi_14_range:
    - 48.0
    - 65.0
    max_positions: 4
    max_new_entries_per_day: 3
    position_size:
      method: atr_normalized
      risk_per_trade_pct: 3.0
      max_position_pct: 50.0
      atr_baseline_pct: 2.0
      atr_vol_scalar_min: 0.5
      atr_vol_scalar_max: 1.5
  exit:
    # 2026-09-09 Barry OK: paper PT 8->8.5; stop 5->5.5; RSI floor 48->50
    # 2026-09-10 Barry OK: base PT 8.5->7.5; trail activate 4.0->3.5 (stop-heavy exit mix)
    # 2026-09-11 Barry OK: trail activate 3.5->3.0
    profit_target_pct: 7.5
    profit_target_atr_cap:
      enabled: true
      atr_multiple: 2.5
    # Cap target at hold-horizon expected move: ATR% × √target_days.
    # With target_days=10 this is ~3.16×ATR%; usually looser than the 2.5×ATR
    # daily cap, but binds on very short target_days or when atr_cap is off.
    profit_target_horizon_cap:
      enabled: true
      sqrt_days_multiple: 1.0
    # Cap target using lookback high/low range: min(room to recent high +1%,
    # realized high−low width). Blocks fantasy targets ATR still allows.
    # Open positions are re-tightened each tick when this binds.
    profit_target_recent_range_cap:
      enabled: true
      lookback_days: 60
      max_extension_above_high_pct: 1.0
    stop_loss_pct: 5.5
    # Noise-scale the stop for low-vol names: effective stop =
    # min(5%, 2.0×ATR%). Without this, utilities/staples (ATR ~1.5%) get a
    # tech-sized 5% stop vs an ATR-capped ~3.7% target → R:R < 1.25 and the
    # gate structurally excludes the defensive rotation candidates.
    stop_loss_atr_cap:
      enabled: true
      atr_multiple: 2.0
    use_oco_at_entry: true
    trailing:
      enabled: true
      activate_after_profit_pct: 3.0
      trail_atr_multiple: 2.0
    time_stop_days: 30
    time_stop_minutes: 0
    tighten_on_earnings_within_days: 3
    thesis:
      enabled: true
      profit_giveback:
        peak_profit_min_pct: 6.0
        exit_if_below_pct: 2.0
      exit_if_below_sma:
      - 20
      exit_if_below_sma_min_peak_profit_pct: 5.0
      exit_on_rs_deterioration_below: -4.0
      regime_exit_profiles:
      - high_vol_chop
      regime_exit_min_profit_pct: 3.0
  closure:
    no_overnight_holds: false
    flatten_by_et: 15:55
    block_entries_after_et: 15:30
  intraday:
    min_relative_volume: 1.2
    momentum_rsi_min: 52.0
    require_above_sma:
    - 9
    - 20
  filters:
    blocked_symbols:
    - TQQQ
    - JPM
    - XLK
    - MU
    - ASML
    - CAT
    no_trade_before_earnings_days: 2
    # Require outperformance vs SPY (was -4 — allowed lagging names).
    min_rs_vs_benchmark_30d: 0.0
    # Anti-chase hard block near highs. Backtest 2y (2024-06→2026-07):
    # loosening to 1.0 diluted expectancy $6.69→$4.52 (chased entries);
    # 3.0 + stop_loss_atr_cap was the best variant (+$432, 60% WR, 3.3% DD).
    # The 6% soft zone below halves size approaching highs.
    min_distance_from_52w_high_pct: 3.0
    near_52w_high_soft_zone_pct: 6.0
    near_52w_high_size_scalar: 0.5
    # Skip ATR-capped targets that invert R:R vs the fixed stop.
    min_reward_risk: 1.25
    # Stop must clear ~1.5 daily ATRs of noise (cuts same-day stop-outs).
    min_stop_atr_multiple: 1.5
    symbol_groups:
    - name: semicap
      symbols:
      - AMD
      - ASML
      - SMH
      - MU
      - NVDA
      max_open: 1
    - name: industrial
      symbols:
      - CAT
      - RTX
      - XLI
      max_open: 1
    - name: healthcare
      symbols:
      - UNH
      - LLY
      max_open: 1
    - name: utilities
      symbols:
      - XLU
      - NEE
      - SO
      - DUK
      max_open: 1
    - name: staples
      symbols:
      - XLP
      - PG
      - KO
      - PEP
      - COST
      - WMT
      max_open: 1
    - name: gold
      symbols:
      - GLD
      - NEM
      max_open: 1
    shuffle:
      enabled: true
      re_entry_cooldown_days: 5
      stop_loss_penalty: 0.5
      repeat_stop_penalty: 0.2
      same_group_open_penalty: 0.2
      underrepresented_group_bonus: 0.08
      lookback_days: 7
      overwhelming_margin: 0.12
      overwhelming_min_rs_vs_benchmark_30d: 5.0
      # Hard cooldown — July sim: AMD was stopped 5x because 'overwhelming'
      # scan scores bypassed the 5d cooldown and re-entered the same chop.
      bypass_cooldown_on_overwhelming: false
  short:
    enabled: false
    min_avg_volume_20d: 2000000.0
    max_spread_pct: 0.4
watchlists:
  core:
  - AAPL
  - MSFT
  - AMD
  - GOOGL
  - QQQ
  - IWM
  thematic:
  - symbol: SMH
    tags:
    - screened
  - symbol: ASML
    tags:
    - screened
  - symbol: UNH
    tags:
    - screened
  - symbol: RTX
    tags:
    - screened
  - symbol: DIA
    tags:
    - screened
  - symbol: XLI
    tags:
    - screened
  - symbol: LLY
    tags:
    - screened
  - symbol: CAT
    tags:
