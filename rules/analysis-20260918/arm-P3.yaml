    refresh_if_older_than_days: 1
    refresh_cooldown_seconds: 3600
risk:
  max_portfolio_heat_pct: 12.0
  max_drawdown_halt_pct: 12.0
  max_trades_per_day: 3
execution:
  entry_order_type: limit
  entry_limit_basis: ask
  bracket_mode: post_fill_oco
  place_bracket_within_seconds: 60
  oco_duration: GTC
  require_preview: true
  wait_for_fill: true
  fill_timeout_seconds: 600
  require_bracket_before_entry_resume: true
llm:
  enabled: true
  selection_model: google/gemini-2.5-flash
  monitor_model: google/gemini-2.5-flash
  web_model: perplexity/sonar
  learn_model: google/gemini-2.5-flash
  # 90s ticks × 40 ≈ 1 hour between selection/monitor LLM reviews
  review_every_ticks: 40
  web_research_every_reviews: 5
  learn_every_ticks: 6
  learn_min_closed_trades: 3
  learn_cooldown_ticks: 20
  backtest_learn_min_closed_trades: 5
  backtest_learn_cooldown_ticks: 30
  max_tokens: 2500
  veto_entries: false
  allow_llm_exits: false
  allow_rule_adaptation: false
  adaptation_bounds:
