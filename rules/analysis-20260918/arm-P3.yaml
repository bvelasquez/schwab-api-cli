      max: 8.0
      max_delta_per_change: 0.5
      min: 3.0
    max_new_entries_per_day:
      max: 2
      max_delta_per_change: 1
      min: 0
    profit_target_pct:
      max: 12.0
      max_delta_per_change: 1.0
      min: 5.0
    risk_per_trade_pct:
      max: 4.8
      max_delta_per_change: 0.6
      min: 0.3
    rsi_14_range:
      max_high: 72
      max_low: 52
      min_high: 60
      min_low: 40
    stop_loss_pct:
      max: 6.0
      max_delta_per_change: 0.5
      min: 2.5
    time_stop_days:
      max: 45
      max_delta_per_change: 5
      min: 5
    trail_atr_multiple:
      max: 3.0
      max_delta_per_change: 0.25
      min: 1.5
  immutable_fields:
  - capital.fixed_sleeve_cap_usd
  - capital.max_pct_of_free_cash
  - capital.min_cash_floor_usd
  - capital.options_risk.fallback_reserve_usd
  - playbook.direction
  - playbook.short.enabled
  - accounts
  prompts:
    selection: |
      You are a conservative swing equity advisor for beneficiary account 9947.
      Each candidate includes technical_context (SMA, RSI, ATR, history_features) and capital_check hints.
      history_features.rs_vs_benchmark_30d_pct is symbol 30d return minus SPY; prefer clearly positive RS.
      Prefer RSI in the mid-50s with price above SMA20/50 — avoid weak RSI pullbacks and overbought >65.
      Reject setups where ATR-capped target would leave reward/risk < ~1.25 vs the stop, or where the
      stop is inside ~1.5 daily ATRs of noise.
      regime and profile_catalog describe market conditions — set profile_selection accordingly.
      Approve new long entries when capital_check passes and entry_shuffle policy allows diversification.
      Prefer candidates from symbol_groups not already in open_groups.
      Defer repeat symbols after recent stop_loss unless shuffle_overwhelming is true in scan.
      Defer on earnings within 2 days, extreme RSI, weak volume, or rs_vs_benchmark_30d_pct below filters.min_rs_vs_benchmark_30d.
      Never recommend shorts unless playbook.short.enabled.
    selection_web: |
      Research US equities suitable for 2-30 day swing trades: momentum with volume,
      sector leaders, and macro headwinds. Return actionable symbols with brief thesis.
      Avoid penny stocks and symbols with earnings in the next 2 sessions.
    monitor: |
      Monitor open swing positions. Mechanical OCO brackets and thesis exits run every tick:
        • Profit giveback: peak ≥ 6% then current < 2%
        • Below SMA(20) after peak ≥ 5%
        • RS vs SPY 30d below -4%
        • Regime high_vol_chop with profit ≥ 3%
      Recommend tighten_exits or widen_exits only when news changes the thesis;
      the agent adjusts OCO stops within bounded limits.
      Do not recommend discretionary sells — thesis and OCO handle exits.
    learn: |
      Analyze recent_closed_trades and sim_stats alongside regime and active_profile.
      Prefer profile_selection to pick baseline|low_vol_trend|high_vol_chop|elevated_vol when regime shifted.
      Propose bounded playbook adjustments via rule_patches only (allowed_patch_paths: exits + rsi_14_range).
      Cite trade symbols, exit_reason, pnl_pct, hold time, and rs_vs_benchmark where relevant.
      Never change immutable_fields or sizing/method/entry caps.
      Prefer small deltas within adaptation_bounds.max_delta_per_change.
