    label: CNBC Top News
    enabled: true
    kind: rss
    url: https://www.cnbc.com/id/100003114/device/rss/rss.html
    phases:
    - premarket_digest
    - overnight_digest
    auth: null
    headers: {}
    max_bytes: 12000
    timeout_seconds: 15
  - id: polygon_market_status
    label: Polygon market status
    enabled: false
    kind: api
    url: https://api.polygon.io/v1/marketstatus/now
    phases:
    - all
    auth:
      kind: bearer
      token_env: POLYGON_API_KEY
      header_name: null
    headers: {}
    max_bytes: 12000
    timeout_seconds: 15
technical:
  history:
