# Swing lab candidate: quality dip buy. Six megacaps, $660 each of the $4,000 sleeve.
# Buy at or below the 20-day EMA while above the 200-day EMA; sell at +8% or below the 200-day EMA.
# Backtest 2018-2026 (20-name basket, 5 slots): CAGR 15.0%, max drawdown 30%, 556 trades. The basket is
# today's survivors, so treat the backtest as optimistic. The backtest's 30-day time stop is not expressed here.
version: 1
broker: public
account: "public:ACCOUNT_ID"
workflows:
  - id: dip-msft
    schedule:
      cron: "50 15 * * 1-5"
      timezone: America/New_York
      active_between: ["15:45", "16:00"]
    steps:
      - id: quote
        fetch: quote
        symbol: MSFT
      - id: ema20
        fetch: ema
        symbol: MSFT
        period: 20
      - id: ema200
        fetch: ema
        symbol: MSFT
        period: 200
      - id: pos
        fetch: position
        symbol: MSFT
      - id: buy
        when:
          all:
            - session_open: true
            - gt: ["quote.last", "ema200"]
            - lte: ["quote.last", "ema20"]
            - position_qty: {symbol: MSFT, eq: 0}
            - buying_power_at_least: 650
        order:
          side: buy
          symbol: MSFT
          notional_usd: 660
          order_type: market
      - id: sell_target
        when:
          all:
            - session_open: true
            - position_qty: {symbol: MSFT, gt: 0}
            - gte: ["pos.unrealized_pct", 8]
        order:
          side: sell
          symbol: MSFT
          quantity: pos.quantity
          order_type: market
      - id: sell_trend
        when:
          all:
            - session_open: true
            - position_qty: {symbol: MSFT, gt: 0}
            - lt: ["quote.last", "ema200"]
        order:
          side: sell
          symbol: MSFT
          quantity: pos.quantity
          order_type: market
