[package]
name = "agent-trader-cli"
description = "Broker-agnostic CLI for plans, options, and account data"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lib]
name = "agent_trader"
path = "src/lib.rs"

[[bin]]
name = "agent-trader"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
broker-core = { path = "../broker-core" }
broker-public = { path = "../broker-public" }
research-core = { path = "../research-core" }
broker-schwab = { path = "../broker-schwab" }
chrono.workspace = true
clap.workspace = true
directories.workspace = true
dotenvy = "0.15"
libc = "0.2"
schwab-api-cli = { path = "../schwab-cli" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
async-trait.workspace = true
tempfile = "3"
