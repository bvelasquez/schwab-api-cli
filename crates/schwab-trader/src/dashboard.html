<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper books</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%2312140f'/%3E%3Cpath d='M3 11h2V8H3zm4 0h2V5H7zm4 0h2V3h-2z' fill='%23e2b15a'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #12140f;
    --card: #1b1e16;
    --line: #313628;
    --text: #e7e4d8;
    --muted: #9a9586;
    --amber: #e2b15a;
    --up: #8fceab;
    --down: #e08b7a;
    --stale: #e2b15a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 ui-sans-serif, system-ui, sans-serif;
  }
  header {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: baseline;
    padding: 18px 22px 8px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  h1 span { color: var(--amber); font-weight: 500; }
  .meta { color: var(--muted); font-size: 12px; }
  main { padding: 8px 22px 40px; display: grid; gap: 16px; }
  .book {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px 16px;
  }
  .book.head-row, .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: baseline;
    flex-wrap: wrap;
  }
  .title { font-size: 16px; font-weight: 600; }
  .badge {
    display: inline-block;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 1px 8px;
    color: var(--amber);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .badge.stale { color: var(--stale); border-color: var(--stale); }
  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    margin: 12px 0;
  }
  .metric { background: #14160f; border-radius: 8px; padding: 8px 10px; }
  .metric .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .metric .v { font-variant-numeric: tabular-nums; font-size: 16px; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 14px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  td.wrap, th.wrap { white-space: normal; min-width: 240px; }
  th { color: var(--muted); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
  td.num, th.num { text-align: right; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  h2 { font-size: 13px; margin: 16px 0 6px; color: var(--muted); font-weight: 600; }
  .halt { color: var(--down); margin: 8px 0 0; }
  .empty { color: var(--muted); }
  .journal { font-size: 12px; }
  .err { color: var(--down); }
  .lab h2 { color: var(--text); font-size: 15px; margin: 14px 0 8px; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .chart-card { background: #14160f; border-radius: 8px; padding: 10px 12px 8px; }
  .chart-card .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .chart-card .note { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  svg.chart { width: 100%; height: auto; display: block; }
  .line-plot { position: relative; }
  svg.line-chart { width: 100%; height: 260px; display: block; }
  svg.line-chart line, svg.line-chart path { vector-effect: non-scaling-stroke; }
  .line-dot {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    transform: translate(-50%, -50%); pointer-events: none;
  }
  .hbar { display: grid; grid-template-columns: 210px 1fr 88px; gap: 10px; align-items: center; margin: 5px 0; }
  .hbar-name { color: #c4bfb0; font-size: 13px; }
  .hbar-track { position: relative; height: 18px; background: #2a2e22; border-radius: 5px; }
  .hbar-fill { position: absolute; top: 3px; height: 12px; border-radius: 3px; }
  .hbar-fill.up { background: var(--up); }
  .hbar-fill.down { background: var(--down); }
  .hbar-val { text-align: right; font-variant-numeric: tabular-nums; }
  nav.tabs { display: flex; gap: 8px; padding: 4px 22px 0; }
  button.tab {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    font: inherit;
    cursor: pointer;
  }
  button.tab.on { color: var(--amber); border-color: var(--amber); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  .pos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 12px; }
  .verdict { font-weight: 600; font-size: 16px; margin: 6px 0 2px; }
  .watch { color: var(--amber); }
  .pos .say { margin: 2px 0 6px; }
  .pos .chart-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; margin: 8px 0 2px; }
  svg.mini { width: 100%; height: auto; display: block; }
  .pos {
    background: #14160f;
    border-radius: 8px;
    padding: 10px 12px 12px;
  }
  .pos .who { font-weight: 600; }
  .pos .pnl { font-variant-numeric: tabular-nums; font-size: 18px; margin: 4px 0; }
  .rail { position: relative; height: 14px; margin: 8px 6px 0; background: #3a3f30; border-radius: 99px; }
  .rail .mark {
    position: absolute; top: 1px; width: 12px; height: 12px; border-radius: 50%;
    transform: translateX(-50%); border: 2px solid #12140f;
  }
  .rail .tick {
    position: absolute; top: -3px; width: 2px; height: 20px; background: var(--amber); transform: translateX(-50%);
  }
  .rail-caps { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin: 6px 0 2px; }
  .learnings { margin: 8px 0 0; padding-left: 18px; }
  .learnings li { margin: 4px 0; }
  .gates { color: var(--muted); font-size: 12px; margin-top: 4px; }
  @media (max-width: 800px) { .charts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Paper books <span>read only</span></h1>
  <div class="meta" id="updated">loading…</div>
</header>
<nav class="tabs" id="tabs">
  <button type="button" class="tab on" data-tab="options">Options</button>
  <button type="button" class="tab" data-tab="swing">Swing</button>
</nav>
<main id="books"></main>
<script>
const books = document.getElementById("books");
const updated = document.getElementById("updated");

function usd(n) {
  if (n == null || Number.isNaN(n)) return "—";
  const sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
}
function usd2(n) {
  if (n == null || Number.isNaN(n)) return "—";
  const sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function pct(n) {
  if (n == null || Number.isNaN(n)) return "—";
  return (n >= 0 ? "+" : "") + n.toFixed(1) + "%";
}
function pct2(n) {
  if (n == null || Number.isNaN(n)) return "—";
  return (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
}
function cls(n) { return n > 0 ? "up" : n < 0 ? "down" : ""; }
function ago(iso) {
  if (!iso) return "no tick yet";
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 90) return Math.round(s) + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  return Math.round(s / 3600) + "h ago";
}
function stale(iso) {
  if (!iso) return true;
  // Arms tick every 300s plus up to 90s of jitter, so 3 minutes flags a healthy book.
  // 10 minutes covers one full cycle and still marks a book that missed its next tick.
  return (Date.now() - new Date(iso).getTime()) > 600000;
}
function el(tag, attrs, text) {
  const node = document.createElement(tag);
  if (attrs) {
    if (attrs.className) node.className = attrs.className;
  }
  if (text != null) node.textContent = text;
  return node;
}
function metric(k, v, klass) {
  const box = el("div", { className: "metric" });
  box.appendChild(el("div", { className: "k" }, k));
  box.appendChild(el("div", { className: "v " + (klass || "") }, v));
  return box;
}
function table(headers, rows) {
  const t = document.createElement("table");
  const thead = document.createElement("thead");
  const hr = document.createElement("tr");
  headers.forEach((h) => {
    const th = el("th", { className: [h.num ? "num" : "", h.wrap ? "wrap" : ""].filter(Boolean).join(" ") }, h.label);
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  t.appendChild(thead);
  const tb = document.createElement("tbody");
  if (!rows.length) {
    const tr = document.createElement("tr");
    const td = el("td", { className: "empty" }, "none");
    td.colSpan = headers.length;
    tr.appendChild(td);
    tb.appendChild(tr);
  }
  rows.forEach((cells) => {
    const tr = document.createElement("tr");
    cells.forEach((c, i) => {
      const td = el("td", { className: [headers[i].num ? "num" : "", headers[i].wrap ? "wrap" : "", c.cls || ""].filter(Boolean).join(" ") }, c.text);
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  return t;
}
function cell(text, klass) { return { text: text == null || text === "" ? "—" : String(text), cls: klass || "" }; }

const COLORS = ["#e2b15a", "#8fceab", "#8eb4e8", "#e08b7a", "#c7b4f5", "#d4c48a"];

function num(n, digits) {
  if (n == null || Number.isNaN(Number(n))) return "—";
  return Number(n).toFixed(digits);
}
function structure(p) {
  if (p.short_strike == null || p.long_strike == null) return p.strategy || "—";
  const kind = String(p.spread_type || "").replaceAll("_", " ");
  return p.short_strike + "/" + p.long_strike + (kind ? " " + kind : "");
}
function shortName(book) {
  return (book.name || "").replace("options-", "");
}
function sleeveReturn(book) {
  const start = book.starting_cash_usd || book.sleeve_cap_usd;
  if (!start) return null;
  return ((book.realized_pnl_usd || 0) + (book.unrealized_pnl_usd || 0)) / start * 100;
}
function dte(expiry) {
  if (!expiry) return null;
  const day = new Date(String(expiry).slice(0, 10) + "T00:00:00");
  if (Number.isNaN(day.getTime())) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.round((day - today) / 86400000);
}
function heldDays(iso) {
  if (!iso) return null;
  const days = (Date.now() - new Date(iso).getTime()) / 86400000;
  return Number.isNaN(days) ? null : Math.max(0, Math.floor(days));
}
function railModel(p, exp) {
  const credit = p.entry_credit;
  const debit = p.debit_to_close;
  if (credit == null || debit == null || !(credit > 0)) return null;
  const targetPct = (exp && exp.profit_target_pct) || 60;
  const stopPct = (exp && exp.stop_loss_pct) || 200;
  const target = credit * (1 - targetPct / 100);
  const stop = credit * (stopPct / 100);
  const span = stop - target;
  if (!(span > 0)) return null;
  const at = (px) => Math.max(0, Math.min(1, (stop - px) / span));
  let progress;
  if (debit > credit) {
    const ratio = Math.min(1, (debit - credit) / Math.max(stop - credit, 0.0001));
    progress = debit >= stop ? "at or through the stop" : Math.round(ratio * 100) + "% of the way from entry to the stop";
  } else {
    const ratio = Math.min(1, (credit - debit) / Math.max(credit - target, 0.0001));
    progress = debit <= target ? "at or through the profit target" : Math.round(ratio * 100) + "% of the way from entry to the target";
  }
  return { credit, debit, target, stop, mark: at(debit), entry: at(credit), winning: debit <= credit, progress };
}
function experimentLine(exp) {
  if (!exp) return "";
  const bits = [];
  if (exp.short_delta_min != null) bits.push("delta " + num(exp.short_delta_min, 2) + "–" + num(exp.short_delta_max, 2));
  if (exp.min_credit != null) bits.push("credit ≥ " + num(exp.min_credit, 2));
  if (exp.min_credit_to_width_pct != null) bits.push(num(exp.min_credit_to_width_pct, 0) + "% of width");
  if (exp.widths && exp.widths.length) bits.push("width " + exp.widths.join("/"));
  else if (exp.max_width != null) bits.push("width ≤ " + num(exp.max_width, 0));
  if (exp.profit_target_pct != null) bits.push("target " + num(exp.profit_target_pct, 0) + "%");
  if (exp.stop_loss_pct != null) bits.push("stop " + num(exp.stop_loss_pct / 100, 1) + "×");
  if (exp.dte_min != null) bits.push("enter " + num(exp.dte_min, 0) + "–" + num(exp.dte_max, 0) + " DTE");
  if (exp.dte_close != null) bits.push("close " + num(exp.dte_close, 0) + " DTE");
  if (exp.max_open_positions != null) bits.push("max open " + num(exp.max_open_positions, 0));
  return bits.join(" · ");
}
function gateName(name) {
  return String(name || "").replaceAll("_", " ");
}
function funnelLine(book) {
  const f = book.entry_funnel;
  if (!f || !f.candidates_seen) return "";
  const rejects = Object.entries(f.rejects || {}).sort((a, b) => b[1] - a[1]);
  const top = rejects.length ? gateName(rejects[0][0]) + " " + rejects[0][1] : "none";
  return "Today's search: " + f.candidates_seen + " candidates, " + (f.admitted || 0) + " admitted. Top reject: " + top + ".";
}
function learnings(options) {
  const notes = [];
  const positions = options.flatMap((b) => (b.positions || []).map((p) => Object.assign({ book: shortName(b), exp: b.experiment }, p)));
  const closedBooks = options.filter((b) => b.closed_count > 0);
  const openBooks = options.filter((b) => !(b.closed_count > 0));
  notes.push(positions.length + " open contracts across " + options.length + " options books.");
  if (positions.length) {
    const under = positions.filter((p) => p.unrealized_usd < 0).length;
    notes.push(under + " of " + positions.length + " would cost more to close today than the credit collected. That is usual while time value remains. The result is the close.");
    const names = [...new Set(positions.map((p) => p.underlying).filter(Boolean))];
    if (names.length === 1) notes.push("Every open fill is " + names[0] + ".");
    const ranked = positions.map((p) => ({ p, rail: railModel(p, p.exp) })).filter((row) => row.rail);
    const losing = ranked.filter((row) => !row.rail.winning).sort((a, b) => a.rail.mark - b.rail.mark);
    const winning = ranked.filter((row) => row.rail.winning).sort((a, b) => b.rail.mark - a.rail.mark);
    const where = (p) => p.book + " " + (p.underlying || "") + " " + structure(p) + (p.expiry ? " exp " + p.expiry : "");
    if (losing[0]) notes.push(where(losing[0].p) + " is the closest open spread to its stop: " + losing[0].rail.progress + ".");
    if (winning[0]) notes.push(where(winning[0].p) + " is the closest open spread to its target: " + winning[0].rail.progress + ".");
  }
  if (openBooks.length) {
    notes.push(openBooks.map(shortName).join(", ") + (openBooks.length === 1 ? " has" : " have") + " no completed round trip, so win rate is not knowable yet.");
  }
  closedBooks.forEach((b) => {
    notes.push(shortName(b) + " has closed " + b.closed_count + " trade" + (b.closed_count === 1 ? "" : "s") + " for " + usd2(b.realized_pnl_usd) + " realized, win rate " + b.win_rate_pct.toFixed(0) + "%.");
  });
  options.forEach((b) => {
    const f = b.entry_funnel;
    if (f && f.candidates_seen > 0 && !(f.admitted > 0)) {
      const top = Object.entries(f.rejects || {}).sort((a, c) => c[1] - a[1])[0];
      notes.push(shortName(b) + " looked at " + f.candidates_seen + " candidates today and took none. The first failing gate was " + (top ? gateName(top[0]) : "unrecorded") + ".");
    }
  });
  const control = options.find((b) => String(b.name || "").includes("8709")) || options[0];
  options.forEach((b) => {
    if (!control || b === control || !b.experiment) return;
    const bits = [];
    const a = b.experiment, c = control.experiment || {};
    const changed = (key, text) => { if (a[key] != null && a[key] !== c[key]) bits.push(text); };
    changed("short_delta_min", "delta " + num(a.short_delta_min, 2) + "–" + num(a.short_delta_max, 2));
    if (a.short_delta_max !== c.short_delta_max && a.short_delta_min === c.short_delta_min) {
      bits.push("delta " + num(a.short_delta_min, 2) + "–" + num(a.short_delta_max, 2));
    }
    changed("min_credit", "credit floor " + num(a.min_credit, 2));
    changed("min_credit_to_width_pct", num(a.min_credit_to_width_pct, 0) + "% of width");
    if (!(a.widths && a.widths.length)) changed("max_width", "max width " + num(a.max_width, 0));
    changed("profit_target_pct", "target " + num(a.profit_target_pct, 0) + "%");
    changed("dte_close", "close at " + num(a.dte_close, 0) + " DTE");
    changed("dte_min", "entry " + num(a.dte_min, 0) + "–" + num(a.dte_max, 0) + " DTE");
    changed("max_open_positions", "max open " + num(a.max_open_positions, 0));
    changed("max_trades_per_day", num(a.max_trades_per_day, 0) + "/day");
    if (a.widths && a.widths.length && JSON.stringify(a.widths) !== JSON.stringify(c.widths || [])) {
      bits.push("width " + a.widths.join("/"));
    }
    if (bits.length) notes.push(shortName(b) + " changes " + shortName(control) + " by " + [...new Set(bits)].join(", ") + ".");
  });
  return notes;
}
function svgEl(name, attrs) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", name);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
}
function barChart(title, rows, note, leftPad) {
  const card = el("div", { className: "chart-card" });
  card.appendChild(el("div", { className: "k" }, title));
  const w = 640, top = 12, bottom = 18, left = leftPad || 118, right = 78;
  const h = Math.max(180, rows.length * 28 + top + bottom);
  const max = Math.max(0.01, ...rows.map((r) => Math.abs(r.value || 0)));
  const svg = svgEl("svg", { viewBox: "0 0 " + w + " " + h, class: "chart" });
  const plotW = w - left - right;
  // Counts are all positive, so the bars start at the labels and use the whole plot.
  // A series that crosses zero keeps a center axis.
  const diverging = rows.some((r) => (r.value || 0) < 0);
  const origin = diverging ? left + plotW / 2 : left;
  const span = diverging ? plotW / 2 - 4 : plotW - 8;
  if (diverging) svg.appendChild(svgEl("line", { x1: origin, x2: origin, y1: top, y2: h - bottom, stroke: "#313628" }));
  const gap = (h - top - bottom) / Math.max(rows.length, 1);
  rows.forEach((r, i) => {
    const y = top + i * gap + 4;
    const bh = Math.max(8, gap - 10);
    const mag = (Math.abs(r.value || 0) / max) * span;
    const x = (r.value || 0) >= 0 ? origin : origin - mag;
    svg.appendChild(svgEl("rect", {
      x, y, width: Math.max(mag, 1), height: bh, rx: 3,
      fill: r.color || ((r.value || 0) >= 0 ? "#8fceab" : "#e08b7a")
    }));
    const label = svgEl("text", { x: 4, y: y + bh * 0.72, fill: "#c4bfb0", "font-size": "14" });
    label.textContent = r.label;
    svg.appendChild(label);
    const val = svgEl("text", {
      x: (r.value || 0) >= 0 ? Math.min(w - 4, x + mag + 6) : Math.max(4, x - 6),
      y: y + bh * 0.72, fill: "#e7e4d8",
      "text-anchor": (r.value || 0) >= 0 ? "start" : "end",
      "font-size": "13"
    });
    val.textContent = r.text;
    svg.appendChild(val);
  });
  card.appendChild(svg);
  if (note) card.appendChild(el("p", { className: "note" }, note));
  return card;
}
function lineChart(title, series, note) {
  const card = el("div", { className: "chart-card" });
  card.appendChild(el("div", { className: "k" }, title));
  const usable = series.filter((s) => (s.points || []).length);
  if (!usable.length) {
    card.appendChild(el("p", { className: "empty" }, "No completed closes yet. The open marks above are the live result."));
    return card;
  }
  const w = 640, h = 220, left = 52, right = 12, top = 12, bottom = 28;
  const pts = usable.flatMap((s) => s.points);
  const xs = pts.map((p) => p.x);
  const ys = pts.map((p) => p.y).concat([0]);
  let minX = Math.min(...xs), maxX = Math.max(...xs);
  if (maxX === minX) { minX -= 86400000; maxX += 86400000; }
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const ySpan = maxY - minY || 1;
  const svg = svgEl("svg", {
    viewBox: "0 0 " + w + " " + h,
    class: "chart line-chart",
    preserveAspectRatio: "none"
  });
  const X = (x) => left + ((x - minX) / (maxX - minX)) * (w - left - right);
  const Y = (y) => top + (1 - (y - minY) / ySpan) * (h - top - bottom);
  svg.appendChild(svgEl("line", { x1: left, x2: w - right, y1: Y(0), y2: Y(0), stroke: "#313628", "stroke-width": "1" }));
  const plot = el("div", { className: "line-plot" });
  plot.appendChild(svg);
  usable.forEach((s) => {
    const d = s.points.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");

  card.appendChild(el("h2", null, "Open positions"));
  if (!positions.length) {
    card.appendChild(el("p", { className: "empty" }, "Flat. No open contracts."));
  } else {
    const grid = el("div", { className: "pos-grid" });
    positions.forEach((row) => grid.appendChild(positionCard(row.book, row.p)));
    card.appendChild(grid);
  }

  const funnelRows = [];
  options.forEach((b) => {
    const f = b.entry_funnel;
    if (!f || !f.candidates_seen) return;
    Object.entries(f.rejects || {}).sort((a, c) => c[1] - a[1]).slice(0, 3).forEach(([gate, n]) => {
      funnelRows.push({ label: shortName(b) + " " + gateName(gate), value: n, text: String(n), color: "#e08b7a" });
    });
    if (f.admitted) funnelRows.push({ label: shortName(b) + " admitted", value: f.admitted, text: String(f.admitted), color: "#8fceab" });
  });
  if (funnelRows.length) {
    card.appendChild(el("h2", null, "Today's entry search"));
    const funnel = el("div", { className: "charts" });
    funnel.appendChild(barChart("First failing gate", funnelRows, "A full book does not scan, so a quiet funnel means the slots are already filled.", 210));
    card.appendChild(funnel);
  }

  card.appendChild(el("h2", null, "What the books show"));
  const list = el("ul", { className: "learnings" });
  learnings(options).forEach((text) => list.appendChild(el("li", null, text)));
  card.appendChild(list);
  return card;
}

function renderBook(book) {
  const card = el("section", { className: "book" });
  const head = el("div", { className: "row" });
  const title = el("div", { className: "title" });
  title.appendChild(document.createTextNode((book.kind === "options" ? "Options" : "Swing") + " · " + (book.name || book.rules_file)));
  title.appendChild(document.createTextNode(" "));
  title.appendChild(el("span", { className: "badge" }, "paper"));
  if (stale(book.last_tick)) {
    title.appendChild(document.createTextNode(" "));
    title.appendChild(el("span", { className: "badge stale" }, "stale"));
  }
  head.appendChild(title);
  const bits = [
    ago(book.last_tick),
    book.session || "",
    book.tick_count != null ? "tick " + book.tick_count : "",
    book.profile || ""
  ].filter(Boolean).join(" · ");
  head.appendChild(el("div", { className: "meta" }, bits));
  card.appendChild(head);
  if (book.error) {
    card.appendChild(el("p", { className: "err" }, book.error));
    return card;
  }
  if (book.halted) card.appendChild(el("p", { className: "halt" }, "Halted: " + book.halted));
  const gates = experimentLine(book.experiment);
  if (gates) card.appendChild(el("div", { className: "gates" }, gates));
  const metrics = el("div", { className: "metrics" });
  metrics.appendChild(metric("Equity", usd(book.equity_usd)));
  metrics.appendChild(metric("Cash", usd(book.cash_usd)));
  metrics.appendChild(metric("Realized", usd2(book.realized_pnl_usd), cls(book.realized_pnl_usd)));
  if (book.unrealized_pnl_usd != null) {
    metrics.appendChild(metric("Open mark", usd2(book.unrealized_pnl_usd), cls(book.unrealized_pnl_usd)));
  }
  metrics.appendChild(metric("Win rate", book.closed_count ? (book.win_rate_pct.toFixed(1) + "%") : "—"));
  metrics.appendChild(metric("Open", String(book.open_count ?? 0)));
  metrics.appendChild(metric("Closed", String(book.closed_count ?? 0)));
  if (book.sleeve_cap_usd) metrics.appendChild(metric("Sleeve", usd(book.sleeve_cap_usd)));
  if (book.deployed_pct != null) metrics.appendChild(metric("Deployed", book.deployed_pct.toFixed(0) + "%"));
  card.appendChild(metrics);
  if (book.kind !== "options" && (book.pnl_series || []).length > 1) {
    card.appendChild(lineChart(
      "Realized P/L",
      [{
        label: book.name || "book",
        color: "#e2b15a",
        points: book.pnl_series.filter((p) => p.at).map((p) => ({ x: new Date(p.at).getTime(), y: p.realized_usd }))
      }],
      null
    ));
  }
  if (book.shadows) card.appendChild(shadowSection(book));

  card.appendChild(el("h2", null, "Open positions"));
  if (book.kind === "options") {
    card.appendChild(table(
      [{label:"Underlying"},{label:"Structure"},{label:"Expiry"},{label:"Health"},{label:"Delta", num:true},{label:"POP", num:true},{label:"Credit", num:true},{label:"Debit", num:true},{label:"Open P/L", num:true},{label:"Max loss", num:true}],
      (book.positions || []).map((p) => {
        const health = positionHealth(p);
        return [
          cell(p.underlying),
          cell(structure(p)),
          cell(p.expiry),
          cell(health ? health.label : "—", health ? health.tone : ""),
          cell(p.entry_short_delta != null ? p.entry_short_delta.toFixed(2) : null),
          cell(p.entry_pop_pct != null ? p.entry_pop_pct.toFixed(0) + "%" : null),
          cell(p.entry_credit != null ? p.entry_credit.toFixed(2) : null),
          cell(p.debit_to_close != null ? p.debit_to_close.toFixed(2) : null),
          cell(usd2(p.unrealized_usd), cls(p.unrealized_usd)),
          cell(usd2(p.max_loss_usd))
        ];
      })
    ));
    const funnel = funnelLine(book);
    if (funnel) card.appendChild(el("p", { className: "meta" }, funnel));
  } else {
    card.appendChild(table(
      [{label:"Symbol"},{label:"Qty", num:true},{label:"Entry", num:true},{label:"Stop", num:true},{label:"Target", num:true},{label:"Value", num:true},{label:"Unrealized", num:true}],
      (book.positions || []).map((p) => [
        cell(p.symbol), cell(p.quantity), cell(p.entry_price != null ? p.entry_price.toFixed(2) : null),
        cell(p.stop_price != null ? p.stop_price.toFixed(2) : null),
        cell(p.profit_limit != null ? p.profit_limit.toFixed(2) : null),
        cell(usd2(p.market_value_usd)),
        cell(pct(p.unrealized_pct), cls(p.unrealized_pct))
      ])
    ));
  }

  card.appendChild(el("h2", null, "Recent closes"));
  card.appendChild(table(
    [{label:"When"},{label:"Symbol"},{label:"P&L", num:true},{label:"%", num:true},{label:"Reason"},{label:"Days", num:true}],
    (book.recent_closes || []).map((t) => [
      cell(t.closed_at ? new Date(t.closed_at).toLocaleString() : null),
      cell(t.symbol || t.underlying),
      cell(usd2(t.pnl_usd), cls(t.pnl_usd)),
      cell(pct(t.pnl_pct), cls(t.pnl_pct)),
      cell(t.exit_reason),
      cell(t.hold_days)
    ])
  ));

  card.appendChild(el("h2", null, "Recent journal"));
  const j = el("div", { className: "journal" });
  const events = book.journal || [];
  if (!events.length) j.appendChild(el("div", { className: "empty" }, "none"));
  events.forEach((ev) => {
    const line = el("div");
    const when = ev.ts ? new Date(ev.ts).toLocaleTimeString() : "";
    line.appendChild(el("span", { className: "meta" }, when + "  "));
    line.appendChild(document.createTextNode((ev.type || "") + (ev.detail ? " — " + ev.detail : "")));
    j.appendChild(line);
  });
  card.appendChild(j);

  return card;
}

function hbars(title, rows, note) {
  const card = el("div", { className: "chart-card" });
  card.appendChild(el("div", { className: "k" }, title));
  const max = Math.max(0.01, ...rows.map((r) => Math.abs(r.value || 0)));
  rows.forEach((r) => {
    const row = el("div", { className: "hbar" });
    row.appendChild(el("span", { className: "hbar-name" }, r.label));
    const track = el("span", { className: "hbar-track" });
    const fill = el("span", { className: "hbar-fill " + ((r.value || 0) >= 0 ? "up" : "down") });
    const half = Math.abs(r.value || 0) / max * 50;
    fill.style.width = Math.max(half, r.value ? 0.8 : 0) + "%";
    fill.style.left = ((r.value || 0) >= 0 ? 50 : 50 - half) + "%";
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("span", { className: "hbar-val " + cls(r.value) }, r.text));
    card.appendChild(row);
  });
  if (note) card.appendChild(el("p", { className: "note" }, note));
  return card;
}
function shadowSection(book) {
  const wrap = el("div");
  wrap.appendChild(el("h2", null, "Shadow arms"));
  const shadows = book.shadows.slice().sort((a, b) => Math.abs(b.realized_pnl_usd || 0) - Math.abs(a.realized_pnl_usd || 0) || String(a.id).localeCompare(String(b.id)));
  wrap.appendChild(hbars(
    "Shadow realized P/L",
    shadows.map((s) => ({
      label: s.id,
      value: s.realized_pnl_usd || 0,
      text: usd2(s.realized_pnl_usd || 0)
    })),
    "Arms with a close are listed first. The scale is the largest realized gain or loss."
  ));
  wrap.appendChild(table(
      [{label:"Arm"},{label:"Start", num:true},{label:"Equity", num:true},{label:"Open", num:true},{label:"Closed", num:true},{label:"Win", num:true},{label:"Realized", num:true},{label:"Tick"}],
      shadows.map((s) => [
        cell(s.id), cell(usd(s.starting_cash_usd)), cell(usd(s.equity_usd)),
        cell(s.open_count), cell(s.closed_count),
        cell(s.closed_count ? s.win_rate_pct.toFixed(0) + "%" : "—"),
        cell(usd2(s.realized_pnl_usd), cls(s.realized_pnl_usd)),
        cell(s.last_tick ? ago(s.last_tick) : "waiting")
      ])
    ));
  return wrap;
}

let tab = location.hash === "#swing" ? "swing" : "options";
let latest = null;

function paint() {
  document.querySelectorAll("button.tab").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  if (!latest) return;
  const all = latest.books || [];
  const options = all.filter((b) => b.kind === "options");
  const swing = all.filter((b) => b.kind !== "options");
  const optBtn = document.querySelector('button[data-tab="options"]');
  const swBtn = document.querySelector('button[data-tab="swing"]');
  if (optBtn) optBtn.textContent = "Options" + (options.length ? " · " + options.length : "");
  if (swBtn) swBtn.textContent = "Swing" + (swing.length ? " · " + swing.length : "");
  const y = window.scrollY;
  const nodes = [];
  const shown = tab === "swing" ? swing : options;
  if (tab === "options") {
    const ok = options.filter((b) => !b.error);
    if (ok.length) nodes.push(renderLab(ok, latest.lab));
  }
  if (!shown.length) nodes.push(el("p", { className: "empty" }, "No " + tab + " books are loaded."));
  nodes.push(...shown.map(renderBook));
  books.replaceChildren(...nodes);
  window.scrollTo(0, y);
}

document.getElementById("tabs").addEventListener("click", (ev) => {
  const button = ev.target.closest("button[data-tab]");
  if (!button || button.dataset.tab === tab) return;
  tab = button.dataset.tab;
  history.replaceState(null, "", tab === "swing" ? "#swing" : "#options");
  window.scrollTo(0, 0);
  paint();
});

async function refresh() {
  try {
    const res = await fetch("/api/status", { cache: "no-store" });
    latest = await res.json();
    updated.textContent = "Updated " + new Date(latest.generated_at).toLocaleTimeString() + " · refreshes every 5s";
    paint();
  } catch (err) {
    updated.textContent = "Refresh failed: " + err;
  }
}
refresh();
setInterval(refresh, 5000);
</script>
